<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Guilhem Mazoyer - Games">
    <title>Guilhem - Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=K2D:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
	<link rel="icon" type="image/png" href="./assets/icons/guilhem_icon.png"/>
    
    <script>
        // Create transition overlay immediately to prevent flash
        (function() {
            const referrer = document.referrer;
            const currentDomain = window.location.origin;
            const isInternalNavigation = referrer && referrer.startsWith(currentDomain) && referrer !== window.location.href;
            
            if (isInternalNavigation) {
                const overlay = document.createElement('div');
                overlay.className = 'page-transition-overlay';
                overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background-color:#000000;z-index:10000;opacity:1;pointer-events:none;transition:opacity 300ms ease;';
                document.documentElement.appendChild(overlay);
            }
        })();
    </script>
</head>
<body class="page-games">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <span class="page-title">Games</span>
        </div>
        <div class="header-right">
            <button class="music-toggle" id="musicToggle" aria-label="Toggle music"></button>
            <button class="menu-toggle" id="menuToggle">
                <span class="menu-text">Menu</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="projects-page">
            <!-- Background Slideshow -->
            <div class="background-slideshow" id="backgroundSlideshow"></div>
            <div class="background-overlay"></div>
            
            <!-- Title Section -->
            <div class="projects-title-section">
                <h2 class="projects-main-title" id="projectsMainTitle">GAMES</h2>
            </div>
            
            <!-- Projects Grid -->
            <div class="projects-grid" id="projectsGrid">
                <!-- Projects will be added dynamically -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-top">
            <a href="mailto:guilhem.mazoyer@laposte.net" class="footer-email">guilhem.mazoyer@laposte.net</a>
            <div class="footer-time" id="footerTime">14:35 France</div>
        </div>
    </footer>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <header class="menu-header">
            <div class="menu-header-left">
                <span class="page-title" id="menuTitle">Menu</span>
            </div>
            <div class="menu-header-right">
                <button class="music-toggle" id="menuMusicToggle" aria-label="Toggle music"></button>
                <button class="menu-close" id="menuClose">
                    <span class="menu-text">Close</span>
                </button>
            </div>
        </header>
        <nav class="menu-nav">
            <a href="index.html" class="menu-link">Main Projects</a>
            <a href="games.html" class="menu-link">Games</a>
            <a href="others.html" class="menu-link">Others</a>
            <a href="contact.html" class="menu-link">Contact</a>
        </nav>
    </div>

    <!-- Audio -->
    <audio id="backgroundMusic" loop>
        <source src="assets/audio/websiteBackgroundMusic.mp3" type="audio/mpeg">
    </audio>

    <script src="js/page-transitions.js"></script>
    <script src="js/data/projects-data.js"></script>
    <script src="js/data/games-data.js"></script>
    <script src="js/data/others-data.js"></script>
    <script src="js/music-handler.js"></script>
    <script src="js/main.js"></script>
    <script src="js/projects-grid.js"></script>
    <script src="js/menu-hover.js"></script>
    <script src="js/title-animation.js"></script>
</body>
</html>
